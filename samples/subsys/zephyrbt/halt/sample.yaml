sample:
  name: Zephyr Behaviour Tree - Halt
  description: |
    The tree halts the running nodes that it leaves. Checks that the
    halt function of a user node runs once, and that the Lua _onHalted
    condition of a node runs after its subtree halted.
common:
  tags:
    - zephyrbt
    - lua
tests:
  samples.zephyrbt.halt:
    platform_allow:
      - native_sim/native/64
      - mps2/an385
    timeout: 30
    harness: console
    harness_config:
      type: one_line
      regex:
        - "I: halt result: work=1 order=1"
  samples.zephyrbt.halt.no_node_info:
    platform_allow:
      - native_sim/native/64
      - mps2/an385
    timeout: 30
    extra_configs:
      # The blackboard and the Lua conditions must work without the node
      # information.
      - CONFIG_ZEPHYR_BEHAVIOUR_TREE_NODE_INFO=n
    harness: console
    harness_config:
      type: one_line
      regex:
        - "I: halt result: work=1 order=1"
